<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>HMS Logo</title>
  <desc>Hospital Management System logo</desc>

  <rect width="400" height="400" fill="white"/>

  <!-- Shield base -->
  <g transform="translate(200, 30)">
    <path d="M0,-10 L72,20 L72,100 Q72,170 0,200 Q-72,170 -72,100 L-72,20 Z"
          fill="#1A2B4A" />

    <!-- Shield inner -->
    <path d="M0,2 L62,28 L62,100 Q62,158 0,186 Q-62,158 -62,100 L-62,28 Z"
          fill="#22395F" />

    <!-- Cross horizontal -->
    <rect x="-38" y="82" width="76" height="22" rx="4" fill="#FFFFFF" />

    <!-- Cross vertical -->
    <rect x="-11" y="55" width="22" height="76" rx="4" fill="#FFFFFF" />

    <!-- Pulse line -->
    <polyline
      points="-38,93 -22,93 -14,68 -6,118 2,78 10,108 18,93 38,93"
      fill="none"
      stroke="#00B4A6"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round" />

    <!-- HMS text -->
    <text x="0" y="245" text-anchor="middle"
          font-family="sans-serif" font-size="32" font-weight="700"
          fill="#1A2B4A" letter-spacing="4">HMS</text>

    <!-- Subtitle -->
    <text x="0" y="268" text-anchor="middle"
          font-family="sans-serif" font-size="11" font-weight="400"
          fill="#4A5E7A" letter-spacing="2">HOSPITAL MANAGEMENT SYSTEM</text>
  </g>
</svg>
